[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "garminxsleep"
version = "0.1.0"
description = "Local dashboard combining Sleepmeter history with Garmin sleep and health data"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "plotly>=5.24",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
sync = ["garminconnect>=0.2"]

[tool.setuptools.packages.find]
include = ["dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
